name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construire le package partagé
        run: pnpm --filter @caisse/shared build
      - name: Lint et formatage
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Migrations sur une base vide
        run: pnpm --filter @caisse/api exec prisma migrate deploy
      - name: Schéma et migrations alignés
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE shadow'
          pnpm --filter @caisse/api exec prisma migrate diff \
            --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow --exit-code
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
